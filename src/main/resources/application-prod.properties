server.port=8080

# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT e cookies de autenticação
# O segredo nunca possui fallback em produção. Use no mínimo 32 caracteres
# aleatórios e mantenha o valor fora do repositório.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
jwt.issuer=${JWT_ISSUER:agerp}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}
jwt.cookie-domain=${JWT_COOKIE_DOMAIN:}
jwt.device-cookie-days=${AGERP_DEVICE_COOKIE_DAYS:180}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Não registrar SQL nem bindings com dados de negócio em produção.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
