
server.port=${HOST_APP_PORT}

# ===============================
# PostgreSQL Database Connection
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JWT / Cookie de autenticação
# ===============================
# O segredo nunca possui fallback em produção. Use no mínimo 32 caracteres
# aleatórios e mantenha o valor fora do repositório.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Multipart (para upload de imagens)
# ===============================
#spring.servlet.multipart.enabled=true
#spring.servlet.multipart.max-file-size=15MB
#spring.servlet.multipart.max-request-size=15MB

# ===============================
# Logging: não registrar SQL/bindings com dados de negócio em produção
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
