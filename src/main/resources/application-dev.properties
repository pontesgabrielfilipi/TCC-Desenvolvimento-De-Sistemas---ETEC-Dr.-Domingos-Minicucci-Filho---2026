# Servidor
server.port=${HOST_APP_PORT:8080}

# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT e cookies
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:agerp}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}
jwt.cookie-domain=${JWT_COOKIE_DOMAIN:}
jwt.device-cookie-days=${AGERP_DEVICE_COOKIE_DAYS:180}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=agerp

# Sessão HTTP sem estado; a autenticação usa JWT.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JWT_COOKIE_SECURE:false}

# Logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.agerp.agerp.security=${LOGGING_LEVEL_COM_AGERP_AGERP:INFO}

# Ferramentas de desenvolvimento
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

spring.jpa.open-in-view=false
