spring.application.name=AGERP

server.port=${HOST_APP_PORT:8080}

# Reconstrói esquema/host da requisição externa a partir do proxy reverso.
# Necessário quando o HTTPS termina no Tailscale Serve antes do Nginx.
server.forward-headers-strategy=none

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# O Flyway assume schemas legados como baseline V1 e executa as evoluções a partir da V2.
spring.flyway.enabled=true
spring.flyway.default-schema=agerp
spring.flyway.schemas=agerp
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.placeholders.auditAppRole=${SPRING_DATASOURCE_USERNAME:aguser}

# Apenas endereços explicitamente confiáveis podem fornecer X-Forwarded-For.
agerp.security.trusted-proxies=${AGERP_TRUSTED_PROXIES:}
agerp.security.cors-origins=${AGERP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
agerp.security.login.max-failures=${AGERP_LOGIN_MAX_FAILURES:10}
agerp.security.login.window-seconds=${AGERP_LOGIN_WINDOW_SECONDS:300}
agerp.export.core-threads=${AGERP_EXPORT_CORE_THREADS:2}
agerp.export.max-threads=${AGERP_EXPORT_MAX_THREADS:4}
agerp.export.queue-capacity=${AGERP_EXPORT_QUEUE_CAPACITY:8}
agerp.export.timeout-ms=${AGERP_EXPORT_TIMEOUT_MS:300000}
agerp.export.concurrent-limit=${AGERP_EXPORT_CONCURRENT_LIMIT:3}
