spring.application.name=AGERP

server.port=${HOST_APP_PORT:8080}

# Reconstrói esquema/host da requisição externa a partir do proxy reverso.
# Necessário quando o HTTPS termina no Tailscale Serve antes do Nginx.
server.forward-headers-strategy=framework

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway assume schemas legados como baseline V1 e executa as evolucoes a partir da V2.
spring.flyway.enabled=true
spring.flyway.default-schema=agerp
spring.flyway.schemas=agerp
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Apenas enderecos explicitamente confiaveis podem fornecer X-Forwarded-For.
agerp.security.trusted-proxies=${AGERP_TRUSTED_PROXIES:}
