map "$remote_addr:$http_x_forwarded_proto" $agerp_forwarded_proto {
    default $scheme;
    "127.0.0.1:https" https;
    "[::1]:https" https;
    "::1:https" https;
    "${AGERP_NGINX_TRUSTED_INGRESS_IP}:https" https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size ${AGERP_NGINX_CLIENT_MAX_BODY_SIZE};

    # XLSX sem buffering no proxy: desconexoes reais do navegador podem chegar
    # ao backend durante a transmissao, em vez de serem absorvidas pelo Nginx.
    location ~ ^/api/admin/relatorios/[^/]+/xlsx$ {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout ${AGERP_NGINX_PROXY_READ_TIMEOUT};
        proxy_connect_timeout ${AGERP_NGINX_PROXY_CONNECT_TIMEOUT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $agerp_forwarded_proto;
    }

    # Mantem a API na mesma origem do frontend e resolve o backend pela rede Docker.
    location /api/ {
        proxy_pass http://backend-api:8080/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout ${AGERP_NGINX_PROXY_CONNECT_TIMEOUT};
        proxy_read_timeout ${AGERP_NGINX_PROXY_READ_TIMEOUT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        # Client input is discarded. The socket peer is the only asserted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Tailscale Serve encerra o TLS antes de encaminhar ao Nginx por HTTP.
        # Preserva o protocolo original para o Spring reconhecer a requisicao HTTPS.
        proxy_set_header X-Forwarded-Proto $agerp_forwarded_proto;
    }

    # SPA React Router - todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
