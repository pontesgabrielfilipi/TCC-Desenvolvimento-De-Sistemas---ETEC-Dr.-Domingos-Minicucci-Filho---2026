services:
  postgres:
    image: postgres:16
    container_name: agerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      APP_DB_USER: ${SPRING_DATASOURCE_USERNAME:?Defina SPRING_DATASOURCE_USERNAME no .env}
      APP_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no .env}
    ports:
      # O backend iniciado pelo VS Code acessa o banco pelo host. Restringir o
      # bind ao loopback evita expor o PostgreSQL na rede local e contorna
      # conflitos do encaminhamento wildcard do Docker Desktop no Windows.
      - "${AGERP_BIND_ADDRESS:-127.0.0.1}:${HOST_POSTGRES_PORT:?Defina HOST_POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dados demonstrativos ficam fora do startup automático: somente estrutura
      # e usuário técnico são aplicados quando o volume nasce vazio.
      - ./docker/postgres/init/v2_create_users.sql:/docker-entrypoint-initdb.d/10_create_users.sql:ro
      - ./docker/postgres/init/v2_init.sql:/docker-entrypoint-initdb.d/20_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Defina POSTGRES_USER} -d ${POSTGRES_DB:?Defina POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agnet

  python-ia-api:
    build:
      context: ./services/python-ia
      dockerfile: Dockerfile
    container_name: agerp-python
    restart: unless-stopped
    environment:
      APP_HOST: ${AGERP_PYTHON_BIND_ADDRESS:-0.0.0.0}
      APP_PORT: ${AGERP_PYTHON_INTERNAL_PORT:-8000}
      # O modelo fica residente em memória; um worker evita duplicar seu consumo.
      APP_WORKERS: ${APP_WORKERS:-1}
      APP_RELOAD: ${APP_RELOAD:-false}
      MODEL_DIR: ${MODEL_DIR:-/app/model}
    ports:
      - "${AGERP_BIND_ADDRESS:-127.0.0.1}:${HOST_API_PORT:?Defina HOST_API_PORT}:${AGERP_PYTHON_INTERNAL_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AGERP_PYTHON_INTERNAL_PORT:-8000}/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agnet

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agerp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-ia-api:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Defina SPRING_PROFILES_ACTIVE no .env}
      # Dentro da rede Docker, localhost seria o proprio container do backend.
      SPRING_DATASOURCE_URL: ${AGERP_DOCKER_DATASOURCE_URL:?Defina AGERP_DOCKER_DATASOURCE_URL no .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Defina SPRING_DATASOURCE_USERNAME no .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no .env}
      # DDL de migrations exige o proprietario das tabelas; a aplicacao continua
      # usando a conta restrita acima para as operacoes normais.
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:?Defina SPRING_FLYWAY_USER no .env}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?Defina SPRING_FLYWAY_PASSWORD no .env}
      # Obrigatórios para evitar subir o backend com segredo conhecido ou cookie
      # incompatível com o protocolo usado no ambiente.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:?Defina JWT_COOKIE_SECURE como true ou false}
      JWT_ISSUER: ${JWT_ISSUER:-agerp}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Strict}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      AGERP_DEVICE_COOKIE_DAYS: ${AGERP_DEVICE_COOKIE_DAYS:-180}
      AGERP_SEED_ENABLED: ${AGERP_SEED_ENABLED:-false}
      # O Spring aceita forwarded headers somente de peers explicitamente confiaveis.
      AGERP_TRUSTED_PROXIES: ${AGERP_TRUSTED_PROXIES:-}
      # Origens exatas autorizadas, incluindo o endpoint HTTPS do Tailscale.
      AGERP_CORS_ORIGINS: ${AGERP_CORS_ORIGINS:?Defina AGERP_CORS_ORIGINS no .env}
      AGERP_IA_URL: ${AGERP_IA_URL:?Defina AGERP_IA_URL no .env}
      AGERP_EXPORT_CORE_THREADS: ${AGERP_EXPORT_CORE_THREADS:-2}
      AGERP_EXPORT_MAX_THREADS: ${AGERP_EXPORT_MAX_THREADS:-4}
      AGERP_EXPORT_QUEUE_CAPACITY: ${AGERP_EXPORT_QUEUE_CAPACITY:-8}
      AGERP_EXPORT_TIMEOUT_MS: ${AGERP_EXPORT_TIMEOUT_MS:-300000}
      AGERP_EXPORT_CONCURRENT_LIMIT: ${AGERP_EXPORT_CONCURRENT_LIMIT:-3}
      AGERP_LOGIN_MAX_FAILURES: ${AGERP_LOGIN_MAX_FAILURES:-10}
      AGERP_LOGIN_WINDOW_SECONDS: ${AGERP_LOGIN_WINDOW_SECONDS:-300}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-2}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-30000}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_AGERP_AGERP: ${LOGGING_LEVEL_COM_AGERP_AGERP:-INFO}
    ports:
      - "${AGERP_BIND_ADDRESS:-127.0.0.1}:${HOST_APP_PORT:?Defina HOST_APP_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agnet

  frontend:
    build:
      context: ./agerp-frontend
      dockerfile: Dockerfile
      args:
        # O navegador usa o proxy de mesma origem configurado no Nginx.
        VITE_API_URL: ${VITE_API_URL:-/}
        # Valores VITE_* entram no bundle apenas durante o build.
    container_name: agerp-frontend
    restart: unless-stopped
    ports:
      # Bind independente para permitir acesso LAN somente ao frontend.
      - "${AGERP_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${HOST_FRONTEND_PORT:?Defina HOST_FRONTEND_PORT}:80"
    environment:
      AGERP_NGINX_PROXY_READ_TIMEOUT: ${AGERP_NGINX_PROXY_READ_TIMEOUT:-300s}
      AGERP_NGINX_PROXY_CONNECT_TIMEOUT: ${AGERP_NGINX_PROXY_CONNECT_TIMEOUT:-30s}
      AGERP_NGINX_CLIENT_MAX_BODY_SIZE: ${AGERP_NGINX_CLIENT_MAX_BODY_SIZE:-10m}
      AGERP_NGINX_TRUSTED_INGRESS_IP: ${AGERP_NGINX_TRUSTED_INGRESS_IP:?Defina o IP de ingresso do Tailscale/Docker inspecionado}
      NGINX_ENVSUBST_FILTER: ^AGERP_NGINX_
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - agnet

volumes:
  pgdata:

networks:
  agnet:
    driver: bridge
