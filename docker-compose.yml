services:
  postgres:
    image: postgres:16
    container_name: agerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${HOST_POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agnet

  python-ia-api:
    build:
      context: ./services/python-ia
      dockerfile: Dockerfile
    container_name: agerp-python
    restart: unless-stopped
    volumes:
      - ./services/python-ia:/app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: 2
      APP_RELOAD: "false"
    ports:
      - "${HOST_API_PORT}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agnet

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agerp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
#      python-ia:
#        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "${HOST_APP_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agnet

  frontend:
    build:
      context: ./agerp-frontend
      dockerfile: Dockerfile
    container_name: agerp-frontend
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT}:80"
#    depends_on:
#      - app
    networks:
      - agnet

volumes:
  pgdata:

networks:
  agnet:
    driver: bridge