<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Clientes - AGERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/imask/7.1.3/imask.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .brand { font-family: 'Poppins', sans-serif; }
        .error-input { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }
        .success-input { border-color: #22c55e !important; }
        .error-text { color: #ef4444; font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col antialiased bg-gray-50">

<div class="flex h-full">
    <!-- Sidebar (mantido igual) -->
    <div class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="p-6 border-b border-slate-800">
            <a href="/" class="brand text-3xl font-bold tracking-tight">AGERP</a>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition text-slate-300">📊 Dashboard</a>
            <a href="/clientes" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-800 text-white font-medium">👥 Clientes</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition text-slate-300">📦 Produtos</a>
        </nav>
    </div>

    <!-- Conteúdo -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b px-8 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-semibold text-gray-800">Clientes</h1>
            <button onclick="abrirModalCadastro()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2 transition">
                + Novo Cliente
            </button>
        </header>

        <div class="p-8 flex-1 overflow-auto">
            <!-- Tabela -->
            <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 text-left">Nome / Razão Social</th>
                        <th class="px-6 py-4 text-left">Tipo</th>
                        <th class="px-6 py-4 text-left">CPF / CNPJ</th>
                        <th class="px-6 py-4 text-left">E-mail</th>
                        <th class="px-6 py-4 text-left">Telefone</th>
                        <th class="px-6 py-4 text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y" th:if="${clientes}">
                    <tr th:each="cliente : ${clientes}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium" th:text="${cliente.nomeRazao}"></td>
                        <td class="px-6 py-4">
                            <span th:if="${cliente.tipo == 'FISICA'}" class="px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-700">Física</span>
                            <span th:if="${cliente.tipo == 'JURIDICA'}" class="px-3 py-1 text-xs rounded-full bg-purple-100 text-purple-700">Jurídica</span>
                        </td>
                        <td class="px-6 py-4" th:text="${cliente.cpfCnpj}"></td>
                        <td class="px-6 py-4" th:text="${cliente.email}"></td>
                        <td class="px-6 py-4" th:text="${cliente.telefone}"></td>
                        <td class="px-6 py-4 text-center space-x-3">
                            <button th:onclick="|editarCliente(${cliente.id})|" class="text-indigo-600 hover:text-indigo-700">Editar</button>
                            <button th:onclick="|deletarCliente(${cliente.id})|" class="text-red-600 hover:text-red-700">Excluir</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modalCliente" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl w-full max-w-lg mx-4 p-8">
        <h2 class="text-2xl font-semibold mb-6" id="modalTitle">Novo Cliente</h2>

        <form id="formCliente" class="space-y-6">
            <input type="hidden" id="clienteId">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Cliente</label>
                <select id="tipo" class="w-full rounded-2xl border border-gray-300 py-3 px-4">
                    <option value="FISICA">Pessoa Física</option>
                    <option value="JURIDICA">Pessoa Jurídica</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome / Razão Social <span class="text-red-500">*</span></label>
                <input type="text" id="nomeRazao" class="w-full rounded-2xl border border-gray-300 py-3 px-4">
                <p id="erroNome" class="error-text hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CPF / CNPJ <span class="text-red-500">*</span></label>
                <input type="text" id="cpfCnpj" class="w-full rounded-2xl border border-gray-300 py-3 px-4">
                <p id="erroCpfCnpj" class="error-text hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" class="w-full rounded-2xl border border-gray-300 py-3 px-4">
                <p id="erroEmail" class="error-text hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                <input type="tel" id="telefone" class="w-full rounded-2xl border border-gray-300 py-3 px-4">
                <p id="erroTelefone" class="error-text hidden"></p>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="button" onclick="fecharModal()"
                        class="flex-1 py-3.5 border border-gray-300 rounded-2xl font-medium">Cancelar</button>
                <button type="button" onclick="salvarCliente()"
                        class="flex-1 py-3.5 bg-indigo-600 text-white rounded-2xl font-medium hover:bg-indigo-700">Salvar Cliente</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ==================== MÁSCARAS ====================
    let cpfCnpjMask, telefoneMask;

    function aplicarMascaras() {
        // Máscara CPF/CNPJ dinâmica
        cpfCnpjMask = IMask(document.getElementById('cpfCnpj'), {
            mask: [
                { mask: '000.000.000-00' },           // CPF
                { mask: '00.000.000/0000-00' }        // CNPJ
            ]
        });

        // Máscara Telefone
        telefoneMask = IMask(document.getElementById('telefone'), {
            mask: '(00) 0000-0000[0]'
        });
    }

    // ==================== VALIDAÇÕES NÍVEL SENIOR ====================
    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

        let sum = 0;
        for (let i = 0; i < 9; i++) sum += parseInt(cpf[i]) * (10 - i);
        let rest = (sum * 10) % 11;
        if (rest === 10 || rest === 11) rest = 0;
        if (rest !== parseInt(cpf[9])) return false;

        sum = 0;
        for (let i = 0; i < 10; i++) sum += parseInt(cpf[i]) * (11 - i);
        rest = (sum * 10) % 11;
        if (rest === 10 || rest === 11) rest = 0;
        return rest === parseInt(cpf[10]);
    }

    function validarCNPJ(cnpj) {
        cnpj = cnpj.replace(/\D/g, '');
        if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;

        let tamanho = cnpj.length - 2;
        let numeros = cnpj.substring(0, tamanho);
        let digitos = cnpj.substring(tamanho);
        let soma = 0;
        let pos = tamanho - 7;

        for (let i = tamanho; i >= 1; i--) {
            soma += numeros.charAt(tamanho - i) * pos--;
            if (pos < 2) pos = 9;
        }
        let resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        if (resultado !== parseInt(digitos.charAt(0))) return false;

        tamanho += 1;
        numeros = cnpj.substring(0, tamanho);
        soma = 0;
        pos = tamanho - 7;
        for (let i = tamanho; i >= 1; i--) {
            soma += numeros.charAt(tamanho - i) * pos--;
            if (pos < 2) pos = 9;
        }
        resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        return resultado === parseInt(digitos.charAt(1));
    }

    // ==================== FUNÇÕES DO MODAL ====================
    function abrirModalCadastro() {
        editandoId = null;
        document.getElementById('modalTitle').textContent = "Novo Cliente";
        document.getElementById('formCliente').reset();
        document.querySelectorAll('.error-text').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('input').forEach(el => el.classList.remove('error-input'));
        document.getElementById('modalCliente').classList.remove('hidden');

        aplicarMascaras();
    }

    function fecharModal() {
        document.getElementById('modalCliente').classList.add('hidden');
    }

    let editandoId = null;

    function salvarCliente() {
        // ... validações mantidas ...

        if (!valido) return;

        const cliente = {
            tipo: document.getElementById('tipo').value,
            nomeRazao: document.getElementById('nomeRazao').value.trim(),
            cpfCnpj: document.getElementById('cpfCnpj').value.trim(),
            email: document.getElementById('email').value.trim(),
            telefone: document.getElementById('telefone').value.trim()
        };

        const url = editandoId ? `/api/clientes/${editandoId}` : '/api/clientes';
        const method = editandoId ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')  // ← Envia token
            },
            body: JSON.stringify(cliente)
        })
            .then(response => {
                if (response.ok) {
                    alert(editandoId ? 'Cliente atualizado com sucesso!' : 'Cliente cadastrado com sucesso!');
                    fecharModal();
                    location.reload();
                } else if (response.status === 403) {
                    alert('Sessão expirada. Faça login novamente.');
                    window.location.href = '/login';
                } else {
                    alert('Erro ao salvar. Verifique os dados.');
                }
            })
            .catch(() => alert('Erro de conexão'));
    }

    function showError(inputId, errorId, message) {
        document.getElementById(inputId).classList.add('error-input');
        const erroEl = document.getElementById(errorId);
        erroEl.textContent = message;
        erroEl.classList.remove('hidden');
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
        aplicarMascaras();
    });
</script>

</body>
</html>
