# ===============================
# Server Configuration
# ===============================
server.port=${HOST_APP_PORT:8080}

# ===============================
# PostgreSQL Database Connection
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JWT Configuration
# ===============================
jwt.secret=agerp-secret-key-2026-very-strong-and-long-key-min-256-bits-change-in-production
jwt.expiration=86400000
    # 24 horas (em milissegundos)

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=INFO
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=agerp

# ===============================
# Security & Session
# ===============================
# Desabilitado porque estamos usando JWT (stateless)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
    # mude para true em produção com HTTPS

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.agerp.agerp.security=DEBUG

# ===============================
# Development Tools
# ===============================
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false

# ===============================
# Multipart (Upload de arquivos - descomente quando necessário)
# ===============================
#spring.servlet.multipart.enabled=true
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

spring.jpa.open-in-view=false




